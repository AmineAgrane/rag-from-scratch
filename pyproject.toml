[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.5.1",
    "langchainhub>=0.1.21",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
